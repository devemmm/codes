apiVersion: v2
name: codes
description: Codes Helm chart for Kubernetes
type: application
version: 1.0.0
appVersion: "1.0.0"

home: https://codes.devemm.rw
icon: https://raw.githubusercontent.com/devemmm/codes/codes/public/img/codes.png

sources:
  - https://github.com/devemmm/codes

dependencies:
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.27
    condition: postgresql.enabled

  - name: meilisearch
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    version: 0.26.0
    condition: meilisearch.enabled
